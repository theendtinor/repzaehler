name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Locate Android project and build APK
        run: |
          ANDROID_DIR=$(find . -maxdepth 3 -name "build.gradle*" -not -path "*/app/*" | head -n 1 | xargs dirname)
          if [ -z "$ANDROID_DIR" ]; then
            echo "Could not find an Android Gradle project! Here is your repo structure:"
            find . -maxdepth 3
            exit 1
          fi
          echo "Found Android project in: $ANDROID_DIR"
          cd "$ANDROID_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v5
        with:
          name: app-debug-apk
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
